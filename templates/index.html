<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IssueRoute - Student Complaint Routing</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 60px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: vertical;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background-color: #f1f5f9;
            border-radius: 6px;
            display: none;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>IssueRoute</h1>

        <p class="subtitle">
            Student Complaint Classification and Department Routing
        </p>

        <textarea
            id="complaint"
            placeholder="Enter your complaint here..."
        ></textarea>

        <button onclick="submitComplaint()">
            Submit Complaint
        </button>

        <div id="result"></div>

    </div>

<script>

    async function submitComplaint() {

        const complaint = document
            .getElementById("complaint")
            .value
            .trim();

        const result = document.getElementById("result");


        // Check if complaint is empty
        if (!complaint) {

            result.style.display = "block";

            result.innerHTML =
                '<p class="error">Please enter a complaint.</p>';

            return;
        }


        // Show processing message
        result.style.display = "block";

        result.innerHTML = "Processing complaint...";


        try {

            // Send complaint to Flask backend
            const response = await fetch("/predict", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    complaint: complaint
                })

            });


            // Convert response to JSON
            const data = await response.json();


            // Handle backend error
            if (!response.ok) {

                result.innerHTML =
                    '<p class="error">' +
                    data.error +
                    '</p>';

                return;
            }


            // --------------------------------
            // Multi-department complaint
            // --------------------------------

            if (data.complaint_type === "Multi-Department") {

                result.innerHTML = `

                    <h3>Prediction Result</h3>

                    <p>
                        <strong>Complaint Type:</strong>
                        Multi-Department
                    </p>

                    <p>
                        <strong>Departments:</strong>
                        ${data.departments.join(", ")}
                    </p>

                    <p>
                        <strong>Status:</strong>
                        ${data.status}
                    </p>

                `;

            }


            // --------------------------------
            // Single-department complaint
            // --------------------------------

            else {

                result.innerHTML = `

                    <h3>Prediction Result</h3>

                    <p>
                        <strong>Complaint Type:</strong>
                        Single-Department
                    </p>

                    <p>
                        <strong>Department:</strong>
                        ${data.departments.join(", ")}
                    </p>

                    <p>
                        <strong>Confidence Margin:</strong>
                        ${data.margin}
                    </p>

                    <p>
                        <strong>Status:</strong>
                        ${data.status}
                    </p>

                `;

            }

        }


        catch (error) {

            result.innerHTML =
                '<p class="error">' +
                'Unable to connect to the server.' +
                '</p>';

        }

    }

</script>

</body>

</html>
