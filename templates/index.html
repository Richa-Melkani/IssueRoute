
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IssueRoute</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="container">

        <header class="page-header">
            <h1>IssueRoute</h1>
            <p>Student Complaint Classification System</p>
        </header>

        <section class="complaint-card">

            <h2>Submit Your Complaint</h2>

            <form id="complaintForm">

                <textarea
                    id="complaint"
                    name="complaint"
                    placeholder="Describe your complaint here..."
                    rows="5"
                    required
                ></textarea>

                <button type="submit" id="submitBtn">
                    Submit Complaint
                </button>

            </form>

            <div id="result" class="result" aria-live="polite" hidden>
            </div>

        </section>

        <section class="testing-section">

            <h3>Testing Complaints</h3>

            <p>
                Write or paste sample complaints here. Select a complaint
                and click the button to use it above.
            </p>

            <textarea
                id="testComplaints"
                rows="4"
                placeholder="Example: My fee payment was successful, but the portal still shows unpaid.

Example: The classroom projector is not working."
            ></textarea>

            <button type="button" id="useTestBtn" class="secondary-btn">
                Use Selected Complaint
            </button>

        </section>

    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
